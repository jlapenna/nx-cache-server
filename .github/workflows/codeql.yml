name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    uses: jlapenna/agent-lcars/.github/workflows/codeql-reusable.yml@main # latest
    permissions:
      contents: read
      packages: read
      security-events: write
    with:
      languages: javascript-typescript
