name: Agent PR Auto-Merge

# Thin caller of the fleet-published agent auto-merge reusable workflow
# (jlapenna/agent-lcars's agent-automerge-reusable.yml -- see its
# docs/published-actions.md; onboarded in agent-lcars#1325). Any PR whose
# author is one of this repo's known coding-agent bot identities
# (vars.AGENT_BOT_LOGINS, a JSON array) gets squash auto-merge enabled
# the moment it's opened/marked ready, gated only on the required checks
# below. Inert until the orchestrating session provisions
# AGENT_BOT_LOGINS / AGENT_FLEET_LOGIN for this repo.
#
# This caller owns what workflow_call cannot carry: the triggers below,
# workflow-level permissions, and this repo's parameter values.
on:
  pull_request:
    types: [opened, ready_for_review]
  pull_request_review:
    types: [submitted]
  # Fast path for the post-merge restore: only fires when a human push
  # triggered the PR's CI run (GITHUB_TOKEN-triggered runs emit no
  # workflow_run events -- see the reusable's own comments).
  workflow_run:
    workflows: [CI]
    types: [completed]
  # Periodic backstop: the close-orphaned-anchors sweep closes the linked
  # issues GitHub's own "Closes #N" handling never closes for
  # GITHUB_TOKEN merges. Hourly rather than homelab's */15: this glue
  # runs on GitHub-hosted minutes and this repo's agent traffic is low.
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  # The reusable's explicit `gh issue close` for merged PRs' linked
  # anchors -- GitHub's native closing-keyword handling does not fire for
  # GITHUB_TOKEN auto-merges (measured in agent-lcars#214).
  issues: write
  pull-requests: write

jobs:
  automerge:
    uses: jlapenna/agent-lcars/.github/workflows/agent-automerge-reusable.yml@main # latest
    with:
      bot-logins: ${{ vars.AGENT_BOT_LOGINS }}
      fleet-login: ${{ vars.AGENT_FLEET_LOGIN }}
      # GitHub-hosted on purpose: glue work must never queue behind a
      # 90-minute agent session on the fleet pool, and it must stay
      # green-capable before this repo's self-hosted capacity deploys.
      runs-on: '["ubuntu-latest"]'
      required-checks: '["verify"]'
      ci-workflow: ci.yml
      extra-main-workflows: '[]'
      deploy-workflow: ''
