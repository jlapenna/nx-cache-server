name: Agent PR Auto-Merge

on:
  pull_request:
    types: [opened, ready_for_review]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write

# PR events supersede an earlier auto-merge evaluation for the same pull
# request. Recovery workflow-runs and the periodic sweep remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_review' }}

jobs:
  automerge:
    uses: jlapenna/agent-lcars/.github/workflows/agent-automerge-reusable.yml@main # latest
    with:
      bot-logins: ${{ vars.AGENT_BOT_LOGINS }}
      fleet-login: ${{ vars.AGENT_FLEET_LOGIN }}
      runs-on: '["nx-cache-server-default"]'
      required-checks: '["verify"]'
      ci-workflow: ci.yml
      extra-main-workflows: '[]'
      deploy-workflow: ''
