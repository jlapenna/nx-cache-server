name: Agent PR Auto-Merge

on:
  pull_request:
    types: [opened, ready_for_review]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  automerge:
    uses: jlapenna/agent-lcars/.github/workflows/agent-automerge-reusable.yml@main # latest
    with:
      bot-logins: ${{ vars.AGENT_BOT_LOGINS }}
      fleet-login: ${{ vars.AGENT_FLEET_LOGIN }}
      runs-on: '["ubuntu-latest"]'
      required-checks: '["verify"]'
      ci-workflow: ci.yml
      extra-main-workflows: '[]'
      deploy-workflow: ''
