name: Publish image

# The image is staged at an immutable commit tag, scanned from the registry,
# and only then promoted to :latest. It uses the same socketless remote-BuildKit
# publishing lane as the homelab's other fleet images: the public repository is
# the source of truth, while the fleet artifact stays in the internal registry.
on:
  push:
    branches: [main]
    paths:
      - apps/nx-cache-server/**
      - .github/workflows/publish-image.yml
      - .github/actions/scan-image/action.yml
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: publish-nx-cache-server-image
  cancel-in-progress: false

jobs:
  publish:
    # A manual dispatch may select another ref. It can verify the workflow,
    # but only reviewed main commits may move the consumer-facing latest tag.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    # This lane has mTLS material for the remote rootless BuildKit builder and
    # a registry publisher password, but never a Docker socket. It is only
    # registered for this repository and this workflow only publishes main.
    runs-on: nx-cache-server-build-client
    timeout-minutes: 60
    env:
      IMAGE_NAME: ${{ vars.HOMELAB_REGISTRY }}/nx-cache-server

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify

      # Multi-platform execution happens on the dedicated rootless builder.
      # This runner is a Buildx client only, so an unreviewed workflow cannot
      # gain control of the placement host through a local Docker daemon.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: remote
          endpoint: tcp://oldbook.lan.jlapenna.net:1234
          driver-opts: |
            cacert=/secrets/buildkit-ca.pem
            cert=/secrets/buildkit-client-cert.pem
            key=/secrets/buildkit-client-key.pem

      - name: Show remote builder
        run: docker buildx inspect --bootstrap

      - name: Assert the runner holds no Docker socket
        run: |
          if [ -S /var/run/docker.sock ]; then
            echo "::error::the publish lane must not mount a Docker socket"
            exit 1
          fi
          echo "no Docker socket present"

      # The credential comes from the encrypted homelab secret store through
      # the dedicated runner lane, never from a GitHub Actions secret. Buildx
      # forwards this client-side login to the remote builder for the push.
      - name: Log in to the internal registry
        run: |
          test -r /secrets/registry-password || {
            echo "::error::registry credential not mounted; check the build-client lane"
            exit 1
          }
          docker login "${{ vars.HOMELAB_REGISTRY }}" \
            --username publisher --password-stdin < /secrets/registry-password

      # Push the immutable staging tag first. Its digest is what the scan
      # steps inspect; :latest is deliberately untouched until they pass.
      - name: Build and push staged image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/nx-cache-server
          file: apps/nx-cache-server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          provenance: true
          sbom: true

      - name: Scan staged image (linux/amd64)
        uses: ./.github/actions/scan-image
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          platform: linux/amd64
          category: nx-cache-server-linux-amd64

      - name: Scan staged image (linux/arm64)
        uses: ./.github/actions/scan-image
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          platform: linux/arm64
          category: nx-cache-server-linux-arm64

      # This is a registry-side manifest copy, not a rebuild, so latest
      # keeps the exact scanned image and its provenance/SBOM attestations.
      - name: Promote staged image to latest
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Log out of the internal registry
        if: always()
        run: docker logout "${{ vars.HOMELAB_REGISTRY }}" || true
