name: Publish image

# The image is staged at an immutable commit tag, scanned from the registry,
# and only then promoted to :latest. This matches the fleet image contract
# while keeping this public project independent of private build infrastructure.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - server.js
      - .github/workflows/publish-image.yml
      - .github/actions/scan-image/action.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: publish-nx-cache-server-image
  cancel-in-progress: false

jobs:
  publish:
    # A manual dispatch may select another ref. It can verify the workflow,
    # but only reviewed main commits may move the consumer-facing latest tag.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nx-cache-server

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the immutable staging tag first. Its digest is what the scan
      # steps inspect; :latest is deliberately untouched until they pass.
      - name: Build and push staged image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=nx-cache-server
          cache-to: type=gha,mode=max,scope=nx-cache-server
          provenance: true
          sbom: true

      - name: Scan staged image (linux/amd64)
        uses: ./.github/actions/scan-image
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          platform: linux/amd64
          category: nx-cache-server-linux-amd64

      - name: Scan staged image (linux/arm64)
        uses: ./.github/actions/scan-image
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          platform: linux/arm64
          category: nx-cache-server-linux-arm64

      # This is a registry-side manifest copy, not a rebuild, so latest
      # keeps the exact scanned image and its provenance/SBOM attestations.
      - name: Promote staged image to latest
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:${GITHUB_SHA}"
