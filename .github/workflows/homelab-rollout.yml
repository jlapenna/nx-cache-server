name: Request Homelab rollout

# Homelab owns this repository's production rollout. After CI validates a
# push to main, ask Homelab to reconcile now instead of Homelab polling this
# repository. The request goes to jlapenna/homelab's source-reconcile.yml,
# which starts the source's reviewed reconciler through its restricted
# trigger and reports the result there; Homelab still deploys latest
# reviewed main itself and keeps a daily backstop for a lost request.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: homelab-rollout-request
  cancel-in-progress: true

jobs:
  request:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for the Agent LCARS App key
        id: key
        env:
          APP_PRIVATE_KEY: ${{ secrets.AGENT_LCARS_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::notice::AGENT_LCARS_PRIVATE_KEY is not configured; Homelab's backstop timer will pick up this push."
            echo "present=false" >>"$GITHUB_OUTPUT"
          else
            echo "present=true" >>"$GITHUB_OUTPUT"
          fi

      # Scoped to dispatching workflows on jlapenna/homelab only: no
      # contents, issues, or pull-request access there.
      - name: Mint a Homelab dispatch token
        if: steps.key.outputs.present == 'true'
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          # Public Agent LCARS App client ID (not a secret).
          client-id: Iv23liO6X8pLJLcTFzyv
          private-key: ${{ secrets.AGENT_LCARS_PRIVATE_KEY }}
          owner: jlapenna
          repositories: homelab
          permission-actions: write

      - name: Dispatch the Homelab source reconciler
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh workflow run source-reconcile.yml \
            --repo jlapenna/homelab \
            --ref main \
            -f source=nx-cache-server \
            -f sha="$SOURCE_SHA"
          echo "Requested Homelab rollout of nx-cache-server ${SOURCE_SHA}: https://github.com/jlapenna/homelab/actions/workflows/source-reconcile.yml"
