name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # A bounded hosted-runner gate prevents a wedged build from consuming the
    # six-hour GitHub default while allowing a cold image build to complete.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # package.json pins npm through `packageManager`, but the runner image
      # ships its own npm and nothing here was activating the pin: every
      # `npm ci` below ran on the runner's bundled npm instead. The npm 12
      # bump (#56) went green that way while a real npm 12 run failed
      # locally (EALLOWGIT on the repo's own git dependency), so this check
      # was passing for the wrong reason. Install the pinned npm and assert
      # the version actually in use matches the pin, so it cannot drift back.
      - name: Activate the pinned npm and prove it is in use
        run: |
          set -euo pipefail
          # Node 25+ no longer bundles Corepack, so `corepack enable npm`
          # cannot shim the toolchain's npm: on Node 26 run 40818546703 printed
          # `packageManager=npm@12.2.1 npm in PATH=11.20.0`. Install the
          # pinned release into setup-node's prefix, which is first on PATH.
          pinned="$(node -p "require('./package.json').packageManager")"
          want="${pinned#npm@}"
          npm install --global "npm@${want}"
          got="$(npm --version)"
          echo "packageManager=$pinned npm in PATH=$got"
          test "$got" = "$want"
      - run: npm ci
      - run: npm run verify
      - run: docker compose config -q
      - run: docker build --tag nx-cache-server:ci apps/nx-cache-server
      - run: >-
          docker run --rm --entrypoint /bin/sh nx-cache-server:ci -c
          'test -r /app/server.js && test "$(stat -c %U:%G /app/server.js)" = node:node
          && test -x /app/canary.sh'

  terraform:
    name: repository-owned Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: v1.17.1
      - name: Verify repository-owned Terraform
        run: |
          ./tools/github-ruleset-root.test.sh
          terraform -chdir=infra/github-ruleset init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/github-ruleset fmt -check -recursive
          terraform -chdir=infra/github-ruleset validate
