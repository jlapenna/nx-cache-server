name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # A bounded hosted-runner gate prevents a wedged build from consuming the
    # six-hour GitHub default while allowing a cold image build to complete.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # package.json pins npm through `packageManager`, but the runner image
      # ships its own npm and nothing here was activating the pin: every
      # `npm ci` below ran on the runner's bundled npm instead. The npm 12
      # bump (#56) went green that way while a real npm 12 run failed
      # locally (EALLOWGIT on the repo's own git dependency), so this check
      # was passing for the wrong reason. Enable corepack and assert the
      # version actually in use matches the pin, so it cannot drift back.
      - name: Activate the pinned npm and prove it is in use
        run: |
          set -euo pipefail
          # `corepack enable` alone does not shim npm -- Corepack installs
          # npm's shim only when asked for it by name -- so the bundled npm
          # stays on PATH and the assertion below fails. Proven on this very
          # branch: run 35545100312 printed
          # `packageManager=npm@12.0.2 npm in PATH=11.19.0`.
          corepack enable npm
          pinned="$(node -p "require('./package.json').packageManager")"
          want="${pinned#npm@}"
          got="$(npm --version)"
          echo "packageManager=$pinned npm in PATH=$got"
          test "$got" = "$want"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: v1.16.3
      - run: npm ci
      - run: npm run verify
      - name: Verify repository-owned Terraform
        run: |
          terraform -chdir=infra/github-ruleset init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/github-ruleset fmt -check -recursive
          terraform -chdir=infra/github-ruleset validate
      - run: docker compose config -q
      - run: docker build --tag nx-cache-server:ci apps/nx-cache-server
      - run: >-
          docker run --rm --entrypoint /bin/sh nx-cache-server:ci -c
          'test -r /app/server.js && test "$(stat -c %U:%G /app/server.js)" = node:node'
