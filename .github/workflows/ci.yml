name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # A bounded hosted-runner gate prevents a wedged build from consuming the
    # six-hour GitHub default while allowing a cold image build to complete.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: docker compose config -q
      - run: docker build --tag nx-cache-server:ci apps/nx-cache-server
      - run: >-
          docker run --rm --entrypoint /bin/sh nx-cache-server:ci -c
          'test -r /app/server.js && test "$(stat -c %U:%G /app/server.js)" = node:node'
