name: Claude Issue Agent

# Thin caller of the fleet-published reusable Claude lane,
# jlapenna/agent-lcars/.github/workflows/agent-lane-claude.yml, consumed
# cross-repo at @main like every other published action from that repo
# (see its docs/published-actions.md). Onboarded in agent-lcars#1325.
#
# This workflow is workflow_dispatch-only: the central orchestrator
# (agent-lcars, the hosted control plane at lcars.jlapenna.net) owns every
# event trigger, authorizes the request, and dispatches this worker with
# the issue number and an immutable broker binding as plain inputs. This
# file keeps only what workflow_call cannot carry: the workflow_dispatch
# input contract (the broker's dispatch surface), the console's
# contract-tested run-name, the permissions grant, and this repo's
# variable/secret spellings passed down as inputs.
#
# NO PER-REPO CLAUDE CREDENTIAL: this lane used to be dark until the
# maintainer minted this repo's own CLAUDE_CODE_OAUTH_TOKEN secret. Since
# agent-lcars#1350 no repo carries a copy -- the lane reads the fleet's one
# canonical token from Secret Manager at run time over WIF (an access token
# minted for claude-token-reader@agent-lcars, then a direct Secret Manager
# read; agent-lcars#1370). All this repo supplies is the `id-token: write`
# grant below and membership in the shared `github` pool's allowlist
# (agent-lcars's infra/terraform/main.tf).

# Keep the console's leading issue-number join key and add the immutable
# broker marker used to reconcile a dispatch after an interrupted bind.
run-name: '#${{ inputs.issue }}: Claude issue agent [dispatch:g${{ inputs.broker_generation }}:${{ inputs.broker_intent_id }}]'

on:
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to run against (manual testing)'
        required: true
      mode:
        description: 'Dispatch mode for router-triggered issue work'
        required: false
        default: 'implement'
      reply:
        description: 'Original maintainer reply when mode is reply'
        required: false
        default: ''
      runbook:
        description: 'Optional skill for a runbook dispatch'
        required: false
        default: ''
      context:
        description: 'Optional deployment or router context'
        required: false
        default: ''
      broker_intent_id:
        description: 'Immutable broker intent ID'
        required: true
      broker_generation:
        description: 'Monotonic broker generation'
        required: true
      broker_dispatch_token:
        description: 'Immutable broker dispatch token'
        required: true

# Least privilege: enough for the agent to comment on the issue, push a
# feature branch, open a pull request, and read CI results on the PRs it
# opens. actions:write (on the workflow's own GITHUB_TOKEN) lets the agent
# re-run failed CI on its PRs.
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: write

# No per-issue concurrency group here (fleet convention): dispatch
# dedup/serialization is the central orchestrator's job -- its per-task
# authority lease enforces at most one ACTIVE generation per issue. A
# workflow-level group here would be actively harmful on top of that:
# GitHub keeps exactly ONE pending run per group, so a second queued run
# would be silently killed before the reusable lane's post-agent gates
# could fire.

jobs:
  claude:
    # The central orchestrator authorizes the request before dispatching
    # this worker; this job only checks that the dispatch actually carries
    # an issue number.
    if: github.event_name == 'workflow_dispatch' && inputs.issue != ''
    # @main, not a SHA/tag: agent-lcars's convention for every cross-repo
    # reference to a published action/workflow from that repo (see its
    # docs/published-actions.md).
    uses: jlapenna/agent-lcars/.github/workflows/agent-lane-claude.yml@main # latest
    with:
      issue: ${{ inputs.issue }}
      mode: ${{ inputs.mode }}
      reply: ${{ inputs.reply }}
      runbook: ${{ inputs.runbook }}
      context: ${{ inputs.context }}
      broker-generation: ${{ inputs.broker_generation }}
      broker-intent-id: ${{ inputs.broker_intent_id }}
      # Dedicated long-session agent pool (arrives with this repo's
      # homelab autoscaler scale set, agent-lcars#1325); agent sessions
      # must never share a short CI/glue pool.
      runs-on-label: ${{ vars.AGENT_RUNNER_LABEL }}
      # 90/60: fleet-standard job backstop and agent-step timeout,
      # matching codex.yml/opencode.yml and the console's
      # RUN_TIMEOUT_MINUTES (agent-lcars#51/#129).
      job-timeout-minutes: 90
      agent-timeout-minutes: 60
      # Consumer defaults are this repo's behavior: no dispatch-bootstrap,
      # no protected snapshot, no long-run-budget label resolution, no
      # ambient GCP for the agent, no queue-drain, no Nx remote cache, and
      # no pnpm store override.
      agent-fleet-login: ${{ vars.AGENT_FLEET_LOGIN }}
      agent-lcars-client-id: ${{ vars.AGENT_LCARS_CLIENT_ID }}
      # Telemetry sidecar (live turns/tokens in the Agent LCARS console),
      # through the fleet-shared write-only telemetry-writer identity. An
      # empty provider (vars not yet provisioned) skips the sidecar.
      telemetry-workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
      telemetry-service-account: ${{ vars.GCP_TELEMETRY_WRITER_SA }}
    secrets:
      AGENT_LCARS_PRIVATE_KEY: ${{ secrets.AGENT_LCARS_PRIVATE_KEY }}
      # NX_CACHE_TOKEN and AGENT_CI_RERUN_TOKEN are optional in the lane
      # and deliberately unset here: this repo has no Nx remote cache, and
      # consumers hand the agent the job token for CI reruns instead of a
      # separate PAT.

  # Central-orchestrator completion callback: calls agent-lcars's shared
  # reusable finalizer cross-repo (the shared-finalizer topology,
  # agent-lcars#1191), so this repo's completion OIDC token names the
  # canonical finalizer bytes instead of a per-repo copy. Always runs: the
  # central orchestrator is this repo's only dispatcher.
  fallback-finalize:
    needs: claude
    if: always() && github.event_name == 'workflow_dispatch' && inputs.issue != ''
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: write
      pull-requests: read
    uses: jlapenna/agent-lcars/.github/workflows/agent-fallback-finalize.yml@main # latest
    with:
      issue: ${{ inputs.issue }}
      generation: ${{ inputs.broker_generation }}
      intent-id: ${{ inputs.broker_intent_id }}
      dispatch-token: ${{ inputs.broker_dispatch_token }}
      worker-workflow: claude.yml
      worker-result: ${{ needs.claude.result }}
      agent: Claude
      fleet-login: ${{ vars.AGENT_FLEET_LOGIN }}
      maintainer: ${{ vars.MAINTAINER_LOGIN }}
