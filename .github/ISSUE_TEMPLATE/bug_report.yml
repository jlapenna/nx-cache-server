name: Bug report
description: Report an unexpected behavior in nx-cache-server.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include access tokens, token maps, or private network details.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: Include the server version or commit and redacted configuration.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
