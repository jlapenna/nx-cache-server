# <path-in-this-repo> <path-in-jlapenna/agent-lcars>
#
# Files this repo copies byte-for-byte from jlapenna/agent-lcars, which owns
# them. They are copies rather than a shared dependency because
# cross-repository source imports are forbidden fleet-wide (agent-lcars#1307,
# #1311), and copies drift in silence. validate.yml's `canonical-sync: true`
# runs agent-lcars's check-canonical-sync against this manifest on every pull
# request, with forbid-strays, so a second copy cannot quietly grow back
# either (agent-lcars#1340 B8).
#
# To change one of these files: edit it in agent-lcars, land it there, then
# re-copy it verbatim here. Editing the copy fails CI.
.agents/skills/worktree-hygiene/SKILL.md .agents/skills/worktree-hygiene/SKILL.md suffix
