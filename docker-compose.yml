services:
  nx-cache-server:
    build: ./apps/nx-cache-server
    image: nx-cache-server:latest
    ports:
      - '${NX_CACHE_PORT:-3000}:3000'
    environment:
      - PORT=3000
      - CACHE_DIR=/data
      - NX_CACHE_ACCESS_TOKEN=${NX_CACHE_ACCESS_TOKEN:-}
      - NX_CACHE_READ_ONLY_ACCESS_TOKEN=${NX_CACHE_READ_ONLY_ACCESS_TOKEN:-}
      # Optional. When set, named tokens from this JSON file replace the two
      # scalar variables above. The path must be absolute on the Docker host.
      - NX_CACHE_TOKENS_FILE=${NX_CACHE_TOKENS_FILE:-}
      # These are the server defaults. Set either value in .env to override.
      - MAX_CACHE_GB=${MAX_CACHE_GB:-50}
      - MAX_AGE_DAYS=${MAX_AGE_DAYS:-14}
    volumes:
      - nx-cache-data:/data
      # Mount the configured token file at the identical in-container path.
      # With map mode disabled this is a harmless read-only /dev/null mount.
      - ${NX_CACHE_TOKENS_FILE:-/dev/null}:${NX_CACHE_TOKENS_FILE:-/dev/null}:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    pids_limit: 256
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  nx-cache-data:
